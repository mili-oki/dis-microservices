name: Deploy Microservices

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Run tests
      run: |
        cd auth-service && mvn test
        cd ../catalog-service && mvn test
        cd ../orders-service && mvn test
        cd ../payments-service && mvn test
        cd ../notifications-service && mvn test
        cd ../gateway && mvn test
        cd ../discovery-service && mvn test
        cd ../config-server && mvn test

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker images
      run: |
        docker compose build
        
    - name: Test Docker images
      run: |
        docker compose up -d
        sleep 30
        ./scripts/check-health.sh
        docker compose down

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to development
      run: |
        echo "Deploying to development environment..."
        # Add your development deployment commands here
        # For example: kubectl apply -f k8s/dev/
        # Or: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment commands here
        # For example: kubectl apply -f k8s/prod/
        # Or: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
        
    - name: Health check
      run: |
        echo "Running health checks..."
        # Add health check commands here
        # ./scripts/check-health.sh
