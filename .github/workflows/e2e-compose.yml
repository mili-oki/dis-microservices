name: E2E - Docker Compose Smoke

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images (compose)
        run: docker compose build

      - name: Start stack
        run: |
          echo "Starting Docker Compose stack..."
          docker compose up -d
          echo "Stack started, checking service status..."
          docker compose ps

      - name: Wait for services (config, eureka, gateway)
        run: |
          set -e
          wait_up () { 
            url="$1"; name="$2"; 
            echo "Waiting for $name at $url";
            for i in {1..180}; do
              out=$(curl -fsS "$url" || true)
              echo "$out" | grep -q '"status":"UP"' && echo "$name is UP" && return 0
              sleep 3
            done
            echo "::error::$name not UP in time"; exit 1
          }
          wait_up "http://localhost:8888/actuator/health" "config-server"
          wait_up "http://localhost:8761/actuator/health" "discovery-service"
          wait_up "http://localhost:8080/actuator/health" "gateway"

      - name: Wait for microservices to register
        run: |
          echo "Waiting for microservices to register with Eureka..."
          sleep 30

      - name: Smoke routes via Gateway
        run: |
          set -e
          endpoints=(
            "catalog-service/actuator/health"
            "orders-service/actuator/health"
            "payments-service/actuator/health"
            "notifications-service/actuator/health"
          )
          for ep in "${endpoints[@]}"; do
            echo "GET /$ep"
            # Add retry logic for gateway routes
            for i in {1..10}; do
              if curl -fsS "http://localhost:8080/$ep" | tee /dev/stderr | grep -q '"status":"UP"'; then
                echo "✓ $ep is UP"
                break
              fi
              if [ $i -eq 10 ]; then
                echo "::error::Failed to reach $ep after 10 attempts"
                exit 1
              fi
              echo "Retrying $ep (attempt $i/10)..."
              sleep 5
            done
          done

      - name: Verify auth-service registration
        run: |
          echo "Verifying auth-service is registered with Eureka..."
          # Check if auth-service is registered in Eureka
          if curl -fsS "http://localhost:8761/eureka/apps/AUTH-SERVICE" | grep -q "AUTH-SERVICE"; then
            echo "✓ Auth-service is registered with Eureka"
          else
            echo "::error::Auth-service not found in Eureka registry"
            exit 1
          fi
          
          # Check if auth-service is responding on its direct port (expect 403 due to security)
          if curl -fsS "http://localhost:8086/" 2>&1 | grep -q "403"; then
            echo "✓ Auth-service is responding on port 8086 (403 expected due to security)"
          else
            echo "::warning::Auth-service not responding as expected on port 8086"
          fi
          
          echo "✓ Auth-service is running and registered (actuator endpoints secured by design)"

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== Docker Compose Logs ==="
          docker compose logs --no-color > compose-logs.txt || true
          echo "=== Service Status ==="
          docker compose ps >> compose-logs.txt || true
          echo "=== System Resources ==="
          df -h >> compose-logs.txt || true
          free -h >> compose-logs.txt || true

      - name: Upload compose logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
