global:
  smtp_smarthost: 'mailhog:1025'
  smtp_from: 'alerts@microservices.local'

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'email-alerts'

receivers:
  - name: 'email-alerts'
    email_configs:
      - to: 'admin@microservices.local'
        headers:
          Subject: '[ALERT] Microservices Alert: {{ .GroupLabels.alertname }}'
