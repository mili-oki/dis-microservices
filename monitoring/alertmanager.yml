global:
  smtp_smarthost: 'mailhog:1025'
  smtp_from: 'alerts@microservices.local'

route:
  group_by: ['alertname', 'job']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
    - match:
        severity: warning
      receiver: 'warning-alerts'

receivers:
  - name: 'web.hook'
    webhook_configs:
      - url: 'http://localhost:5001/'

  - name: 'critical-alerts'
    email_configs:
      - to: 'admin@microservices.local'
        headers:
          Subject: '[CRITICAL] Microservices Alert: {{ .GroupLabels.alertname }}'
          X-Priority: '1'

  - name: 'warning-alerts'
    email_configs:
      - to: 'admin@microservices.local'
        headers:
          Subject: '[WARNING] Microservices Alert: {{ .GroupLabels.alertname }}'
          X-Priority: '3'

  # Circuit Breaker specific alerts
  - name: 'circuit-breaker-alerts'
    email_configs:
      - to: 'devops@microservices.local'
        headers:
          Subject: '[CIRCUIT BREAKER] Service {{ .GroupLabels.job }} Circuit Breaker Alert'
          X-Priority: '1'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job']
