global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Eureka Discovery Service
  - job_name: 'discovery-service'
    static_configs:
      - targets: ['discovery-service:8761']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 30s

  # Config Server
  - job_name: 'config-server'
    static_configs:
      - targets: ['config-server:8888']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 30s

  # API Gateway
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8080']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s

  # Auth Service
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8086']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s

  # Catalog Service
  - job_name: 'catalog-service'
    static_configs:
      - targets: ['catalog-service:8082']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s

  # Orders Service
  - job_name: 'orders-service'
    static_configs:
      - targets: ['orders-service:8083']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s

  # Payments Service
  - job_name: 'payments-service'
    static_configs:
      - targets: ['payments-service:8084']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s

  # Notifications Service
  - job_name: 'notifications-service'
    static_configs:
      - targets: ['notifications-service:8085']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s

  # RabbitMQ
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    scrape_interval: 30s
